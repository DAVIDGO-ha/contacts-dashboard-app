name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack app source
        run: unzip -o app-source.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        run: cd src && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp src/app/build/outputs/apk/debug/app-debug.apk ContactsDashboard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ContactsDashboard-apk
          path: ContactsDashboard.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest ContactsDashboard.apk -t "Contacts Dashboard APK" -n "Install ContactsDashboard.apk on your Android phone."
